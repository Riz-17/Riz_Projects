<!DOCTYPE html>
<html>
<head>
    <title>Laundry Service Management System - Rizwan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Laundry Service Management System</h1>
    <h3>Welcome to Rizwan's Laundry Service</h3>

    <form id="orderForm">
        <input type="text" id="name" placeholder="Customer Name" required>

        <input type="text" id="phone" placeholder="Phone Number" required>

        <select id="service_id" required>
            <option value="">Select Service</option>
            <option value="1">Washing</option>
            <option value="2">Ironing</option>
            <option value="3">Dry Cleaning</option>
        </select>

        <input type="number" id="weight" placeholder="Clothes Weight (kg)" step="0.1" min="0.1" required>

        <input type="date" id="delivery_date" required>

        <button type="submit">Place Order</button>
    </form>

    <h2>Customer Orders</h2>
    <div id="orders"></div>

    <script src="script.js"></script>
</body>
</html>
